name: Platform Smoke Test

on:
  push:
    branches: ["feature/odd-migration", "feature/agent-adapters-pi-vscode"]
  pull_request:
    branches: ["feature/odd-migration", "feature/agent-adapters-pi-vscode", "main"]
  workflow_dispatch:

jobs:
  install:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Install the branch under test (PR head or pushed branch), never the base branch.
      MENTORKIT_BRANCH: ${{ github.head_ref || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap in clean project
        shell: bash
        run: |
          TEST_DIR="$(mktemp -d)"
          echo "MENTORKIT_TEST_DIR=$TEST_DIR" >> "$GITHUB_ENV"
          cd "$TEST_DIR"
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -ExecutionPolicy Bypass -Command '& "$env:GITHUB_WORKSPACE\bootstrap.ps1"'
          else
            bash "$GITHUB_WORKSPACE/bootstrap.sh"
          fi
      - name: Verify native runtime
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -ExecutionPolicy Bypass -File ./.opencode/mentorkit-verify.ps1
          else
            bash ./.opencode/mentorkit-verify.sh
          fi
      - name: Verify codebase-memory-mcp across agents
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -ExecutionPolicy Bypass -File ./.opencode/mentorkit-verify.ps1 -Json > mcp-verify.json
          else
            bash ./.opencode/mentorkit-verify.sh --json > mcp-verify.json
          fi
          cat mcp-verify.json
          PY="$(command -v python3 || command -v python)"
          "$PY" -c '
          import json
          m = json.load(open("mcp-verify.json", encoding="utf-8-sig"))["mcp"]
          assert m["handshake"] and m["tools"] > 0, "handshake MCP fallido"
          assert m["version"] == m["pinned"], "version distinta de la fijada"
          assert set(m["clients"]) == {"claude", "codex", "opencode", "cursor"}, "faltan agentes"
          bad = [c for c, v in m["clients"].items() if not v["ok"]]
          assert not bad, "agentes sin configurar: %s" % bad
          '
      - name: Verify ODD task creation
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -ExecutionPolicy Bypass -File ./.opencode/mentorkit-odd-task.ps1 platform-smoke "Validate native $RUNNER_OS runtime"
          else
            bash ./.opencode/mentorkit-odd-task.sh platform-smoke "Validate native $RUNNER_OS runtime"
          fi
          test -f odd/tasks/platform-smoke.md
      - name: Verify ODD planning contracts
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          test -f odd/CONTRACT.md
          test -f odd/planning/CONTRACT.md
          test -f odd/planning/README.md
          test -f odd/planning/templates/implementation-plan.md
          grep -qi "PRD analysis" odd/planning/CONTRACT.md
          grep -q "Implementation Plan" odd/planning/CONTRACT.md
          grep -q "odd/tasks/<feature-name>.md" odd/planning/README.md
      - name: Verify multi-format PRD contracts
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          grep -q "PDF" .opencode/skills/document-extractor/SKILL.md
          grep -q "DOCX" .opencode/skills/document-extractor/SKILL.md
          grep -q "DOC" .opencode/skills/document-extractor/SKILL.md
          grep -q "anydoc.to_markdown(file_path)" .opencode/skills/document-extractor/SKILL.md
          grep -q "odd/planning/<feature-name>.md" .opencode/skills/prd-reader/SKILL.md
      - name: Verify PRD/DRP extractor (installed copy)
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          test -f .opencode/prd_extract.py
          grep -q "mentorkit.py extract" .opencode/skills/document-extractor/SKILL.md
          grep -q "Descripción textual del requisito" .opencode/skills/prd-reader/SKILL.md
          PY="$(command -v python3 || command -v python)"
          OC="$(cd .opencode && (pwd -W 2>/dev/null || pwd))"
          MENTORKIT_OPENCODE_DIR="$OC" "$PY" -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          if "$PY" -I .opencode/mentorkit.py extract does-not-exist.odt; then
            echo "extract debía fallar con un archivo inexistente"; exit 1
          fi
      - name: Verify codebase knowledge contracts
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          test -f odd/knowledge/CONTRACT.md
          test -f odd/knowledge/README.md
          grep -q "codebase-memory-mcp" odd/knowledge/CONTRACT.md
          grep -q "Graphify" odd/knowledge/CONTRACT.md
          grep -q "Fingerprinting" odd/knowledge/CONTRACT.md
          grep -q "Codebase Knowledge Snapshot" odd/knowledge/CONTRACT.md
          grep -q "codebase-memory-mcp" .opencode/skills/codebase-graph/SKILL.md
          grep -q "Graphify" .opencode/skills/codebase-graph/SKILL.md
      - name: Verify agent compatibility contract
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          test -f AGENTS.md
          test -f odd/CONTRACT.md
          grep -q "runtime-neutral" odd/CONTRACT.md
          test -f CLAUDE.md
          test -f .cursor/rules/mentorkit-odd.mdc
          test -f .claude/skills/mentorkit/SKILL.md
          test -f .agents/skills/mentorkit/SKILL.md
          test -f .pi/README.md
          test -f .github/copilot-instructions.md
          test -f .github/agents/mentorkit.agent.md
          test -f .github/skills/mentorkit/SKILL.md
          grep -q "odd/CONTRACT.md" .pi/README.md
          grep -q "odd/CONTRACT.md" .github/copilot-instructions.md
          grep -q "odd/CONTRACT.md" .github/agents/mentorkit.agent.md
          grep -q "Pi" .agents/skills/mentorkit/SKILL.md
          grep -q "AUTHORIZE" AGENTS.md
          grep -q "SUBSTANTIAL" AGENTS.md
          grep -q "odd/tasks/<feature>.md" AGENTS.md

  context-selection:
    name: Context selection — ${{ matrix.context }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        context: [claude, opencode, codex, cursor, pi, vscode]
    env:
      MENTORKIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      MENTORKIT_CONTEXTS: ${{ matrix.context }}
    steps:
      - uses: actions/checkout@v4
      - name: Install selected context only
        run: |
          TEST_DIR="$(mktemp -d)"
          echo "MENTORKIT_TEST_DIR=$TEST_DIR" >> "$GITHUB_ENV"
          cd "$TEST_DIR"
          bash "$GITHUB_WORKSPACE/bootstrap.sh"
      - name: Assert context-specific installation
        run: |
          cd "$MENTORKIT_TEST_DIR"
          test -f odd/CONTRACT.md
          test -f AGENTS.md
          test -f .mentorkit/install.json
          python3 -c 'import json; assert json.load(open(".mentorkit/install.json"))["contexts"] == ["${{ matrix.context }}"]'
          case "${{ matrix.context }}" in
            claude) test -f CLAUDE.md; test -f .claude/skills/mentorkit/SKILL.md; test ! -e .opencode; test ! -e .cursor; test ! -e .pi; test ! -e .github/copilot-instructions.md ;;
            opencode) test -f .opencode/agents/MentorKit5.0.md; test -f Makefile; test ! -e .claude; test ! -e .cursor; test ! -e .pi; test ! -e .github/copilot-instructions.md ;;
            codex) test -f .agents/skills/mentorkit/SKILL.md; test ! -e .opencode; test ! -e .claude; test ! -e .cursor; test ! -e .pi; test ! -e .github/copilot-instructions.md ;;
            cursor) test -f .cursor/rules/mentorkit-odd.mdc; test ! -e .opencode; test ! -e .claude; test ! -e .agents; test ! -e .pi; test ! -e .github/copilot-instructions.md ;;
            pi) test -f .pi/README.md; test -f .agents/skills/mentorkit/SKILL.md; test ! -e .opencode; test ! -e .claude; test ! -e .cursor; test ! -e .github/copilot-instructions.md ;;
            vscode) test -f .github/copilot-instructions.md; test -f .github/agents/mentorkit.agent.md; test ! -e .opencode; test ! -e .claude; test ! -e .cursor; test ! -e .agents; test ! -e .pi ;;
          esac

  windows-context-selection:
    name: Windows selective installation
    runs-on: windows-latest
    env:
      MENTORKIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      MENTORKIT_CONTEXTS: claude,codex,pi
    steps:
      - uses: actions/checkout@v4
      - name: Install selected contexts with PowerShell
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP ("mentorkit-context-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $testDir | Out-Null
          Set-Location $testDir
          & "$env:GITHUB_WORKSPACE\bootstrap.ps1"
          if (-not (Test-Path ".mentorkit/install.json")) { throw "Install manifest missing." }
          $manifest = Get-Content ".mentorkit/install.json" -Raw | ConvertFrom-Json
          if (($manifest.contexts -join ",") -ne "claude,codex,pi") { throw "Unexpected selected contexts in manifest." }
          foreach ($path in @("CLAUDE.md",".claude/skills/mentorkit/SKILL.md",".agents/skills/mentorkit/SKILL.md",".pi/README.md","odd/CONTRACT.md")) {
            if (-not (Test-Path $path)) { throw "Missing selected artifact: $path" }
          }
          foreach ($path in @(".opencode",".cursor",".github/copilot-instructions.md","Makefile")) {
            if (Test-Path $path) { throw "Unselected artifact was installed: $path" }
          }
