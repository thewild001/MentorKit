name: Platform Smoke Test

on:
  push:
    branches: ["feature/odd-migration"]
  pull_request:
    branches: ["feature/odd-migration", "main"]
  workflow_dispatch:

jobs:
  install:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Install the branch under test (PR head or pushed branch), never the base branch.
      MENTORKIT_BRANCH: ${{ github.head_ref || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap in clean project
        shell: bash
        run: |
          TEST_DIR="$(mktemp -d)"
          echo "MENTORKIT_TEST_DIR=$TEST_DIR" >> "$GITHUB_ENV"
          cd "$TEST_DIR"
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -ExecutionPolicy Bypass -Command '& "$env:GITHUB_WORKSPACE\bootstrap.ps1"'
          else
            bash "$GITHUB_WORKSPACE/bootstrap.sh"
          fi
      - name: Verify native runtime
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -ExecutionPolicy Bypass -File ./.opencode/mentorkit-verify.ps1
          else
            bash ./.opencode/mentorkit-verify.sh
          fi
      - name: Verify codebase-memory-mcp across agents
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -ExecutionPolicy Bypass -File ./.opencode/mentorkit-verify.ps1 -Json > mcp-verify.json
          else
            bash ./.opencode/mentorkit-verify.sh --json > mcp-verify.json
          fi
          cat mcp-verify.json
          PY="$(command -v python3 || command -v python)"
          "$PY" -c '
          import json
          m = json.load(open("mcp-verify.json", encoding="utf-8-sig"))["mcp"]
          assert m["handshake"] and m["tools"] > 0, "handshake MCP fallido"
          assert m["version"] == m["pinned"], "version distinta de la fijada"
          assert set(m["clients"]) == {"claude", "codex", "opencode", "cursor"}, "faltan agentes"
          bad = [c for c, v in m["clients"].items() if not v["ok"]]
          assert not bad, "agentes sin configurar: %s" % bad
          '
      - name: Verify ODD task creation
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -ExecutionPolicy Bypass -File ./.opencode/mentorkit-odd-task.ps1 platform-smoke "Validate native $RUNNER_OS runtime"
          else
            bash ./.opencode/mentorkit-odd-task.sh platform-smoke "Validate native $RUNNER_OS runtime"
          fi
          test -f odd/tasks/platform-smoke.md
      - name: Verify ODD planning contracts
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          test -f odd/CONTRACT.md
          test -f odd/planning/CONTRACT.md
          test -f odd/planning/README.md
          test -f odd/planning/templates/implementation-plan.md
          grep -qi "PRD analysis" odd/planning/CONTRACT.md
          grep -q "Implementation Plan" odd/planning/CONTRACT.md
          grep -q "odd/tasks/<feature-name>.md" odd/planning/README.md
          grep -q "repository-mismatch" odd/planning/CONTRACT.md
          grep -q "Repository fit" odd/planning/templates/implementation-plan.md
          grep -q "repository-mismatch" .opencode/skills/prd-reader/SKILL.md
      - name: Verify multi-format PRD contracts
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          grep -q "PDF" .opencode/skills/document-extractor/SKILL.md
          grep -q "DOCX" .opencode/skills/document-extractor/SKILL.md
          grep -q "DOC" .opencode/skills/document-extractor/SKILL.md
          grep -q "anydoc.to_markdown(file_path)" .opencode/skills/document-extractor/SKILL.md
          grep -q "odd/planning/<feature-name>.md" .opencode/skills/prd-reader/SKILL.md
      - name: Verify PRD/DRP extractor (installed copy)
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          test -f .opencode/prd_extract.py
          grep -q "mentorkit.py extract" .opencode/skills/document-extractor/SKILL.md
          grep -q "Descripción textual del requisito" .opencode/skills/prd-reader/SKILL.md
          PY="$(command -v python3 || command -v python)"
          OC="$(cd .opencode && (pwd -W 2>/dev/null || pwd))"
          MENTORKIT_OPENCODE_DIR="$OC" "$PY" -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          if "$PY" -I .opencode/mentorkit.py extract does-not-exist.odt; then
            echo "extract debía fallar con un archivo inexistente"; exit 1
          fi
      - name: Verify codebase knowledge contracts
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          test -f odd/knowledge/CONTRACT.md
          test -f odd/knowledge/README.md
          grep -q "codebase-memory-mcp" odd/knowledge/CONTRACT.md
          grep -q "Graphify" odd/knowledge/CONTRACT.md
          grep -q "Fingerprinting" odd/knowledge/CONTRACT.md
          grep -q "Codebase Knowledge Snapshot" odd/knowledge/CONTRACT.md
          grep -q "codebase-memory-mcp" .opencode/skills/codebase-graph/SKILL.md
          grep -q "Graphify" .opencode/skills/codebase-graph/SKILL.md
      - name: Verify agent compatibility contract
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          test -f AGENTS.md
          test -f odd/CONTRACT.md
          grep -q "runtime-neutral" odd/CONTRACT.md
          test -f CLAUDE.md
          test -f .cursor/rules/mentorkit-odd.mdc
          test -f .claude/skills/mentorkit/SKILL.md
          test -f .agents/skills/mentorkit/SKILL.md
          grep -q "AUTHORIZE" AGENTS.md
          grep -q "SUBSTANTIAL" AGENTS.md
          grep -q "odd/tasks/<feature>.md" AGENTS.md
