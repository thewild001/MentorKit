name: Platform Smoke Test

on:
  push:
    branches: ["feature/odd-migration"]
  pull_request:
    branches: ["feature/odd-migration", "main"]
  workflow_dispatch:

jobs:
  install:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap in clean project
        shell: bash
        run: |
          TEST_DIR="$(mktemp -d)"
          echo "MENTORKIT_TEST_DIR=$TEST_DIR" >> "$GITHUB_ENV"
          cd "$TEST_DIR"
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -ExecutionPolicy Bypass -Command '$env:MENTORKIT_BRANCH="feature/odd-migration"; & "$env:GITHUB_WORKSPACE\bootstrap.ps1"'
          else
            MENTORKIT_BRANCH=feature/odd-migration bash "$GITHUB_WORKSPACE/bootstrap.sh"
          fi
      - name: Verify native runtime
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -ExecutionPolicy Bypass -File ./.opencode/mentorkit-verify.ps1
          else
            bash ./.opencode/mentorkit-verify.sh
          fi
      - name: Verify ODD task creation
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -ExecutionPolicy Bypass -File ./.opencode/mentorkit-odd-task.ps1 platform-smoke "Validate native $RUNNER_OS runtime"
          else
            bash ./.opencode/mentorkit-odd-task.sh platform-smoke "Validate native $RUNNER_OS runtime"
          fi
          test -f odd/tasks/platform-smoke.md
      - name: Verify agent compatibility contract
        shell: bash
        run: |
          cd "$MENTORKIT_TEST_DIR"
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f .cursor/rules/mentorkit-odd.mdc
          test -f .claude/skills/mentorkit/SKILL.md
          test -f .agents/skills/mentorkit/SKILL.md
          grep -q "AUTHORIZE" AGENTS.md
          grep -q "SUBSTANTIAL" AGENTS.md
          grep -q "odd/tasks/<feature>.md" AGENTS.md
